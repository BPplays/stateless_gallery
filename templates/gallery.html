<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" href="/favicon.png" type="image/png">
		<title>__TITLE__</title>

		<!-- Image data embedded early so the preload script below can read it
			 without waiting for the body script to execute. -->
		<script type="application/json" id="gallery-data">__IMAGES_JSON__</script>

		<!-- If the page was opened with a hash (direct link to an image),
			 inject a high-priority preload immediately during HTML parse
			 to minimise LCP resource load delay. -->
		<script>
		(function () {
			var hash = location.hash;
			if (!hash) return;
			try {
				var name   = decodeURIComponent(hash.slice(1));
				var images = JSON.parse(document.getElementById("gallery-data").textContent);
				for (var i = 0; i < images.length; i++) {
					if (images[i].name === name) {
						var link = document.createElement("link");
						link.rel  = "preload";
						link.as   = "image";
						link.href = images[i].full;
						link.setAttribute("fetchpriority", "high");
						document.head.appendChild(link);
						break;
					}
				}
			} catch (e) {}
		}());
		</script>

		<!-- Fonts loaded async (media="print" trick) so they never block
			 the initial render. System fonts display immediately; Inter/Noto
			 swap in once the stylesheet arrives. -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="preload" as="style"
			  href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+JP:wght@100..900&display=swap">
		<link rel="stylesheet" media="print"
			  href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+JP:wght@100..900&display=swap"
			  onload="this.media='all'">
		<noscript>
			<link rel="stylesheet"
				  href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+JP:wght@100..900&display=swap">
		</noscript>

		<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

		:root {
			--bg:      #0d0d0d;
			--surface: #181818;
			--border:  #2a2a2a;
			--text:    #e2e2e2;
			--muted:   #666;
			--accent:  #fff;
			--radius:  3px;
			--gap:     3px;
		}

		html, body {
			height: 100%;
			background: var(--bg);
			color: var(--text);
			font-family: 'Inter', "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			-webkit-font-smoothing: antialiased;
		}

		/* ── Header ─────────────────────────────────────────────── */
		header {
			display: flex; align-items: baseline; gap: 14px;
			padding: 20px 24px 14px;
			border-bottom: 1px solid var(--border);
			position: sticky; top: 0;
			background: var(--bg); z-index: 10;
		}
		header h1    { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; color: var(--accent); }
		header .count { font-size: 0.8rem; color: var(--muted); }

		/* ── Gallery grid ────────────────────────────────────────── */
		#gallery {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
			gap: var(--gap); padding: var(--gap);
		}
		.thumb-item {
			aspect-ratio: 1; overflow: hidden;
			background: var(--surface); cursor: pointer;
			position: relative; border-radius: var(--radius);
		}
		.thumb-item img {
			width: 100%; height: 100%; object-fit: cover; display: block;
			transition: transform .35s cubic-bezier(.25,.46,.45,.94), opacity .2s;
		}
		.thumb-item:hover img { transform: scale(1.055); opacity: .88; }
		.thumb-item .label {
			position: absolute; inset: auto 0 0 0;
			padding: 28px 10px 10px;
			background: linear-gradient(transparent, rgba(0,0,0,.72));
			font-size: .72rem; color: rgba(255,255,255,.85);
			white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
			opacity: 0; transition: opacity .18s;
			pointer-events: none;
			border-radius: 0 0 var(--radius) var(--radius);
		}
		.thumb-item:hover .label { opacity: 1; }
		.empty {
			grid-column: 1/-1; text-align: center;
			padding: 80px 20px; color: var(--muted); font-size: .95rem;
		}

		/* ── Lightbox ────────────────────────────────────────────── */
		#lightbox {
			display: none; position: fixed; inset: 0; z-index: 1000;
			background: rgba(5,5,5,.97); overflow: hidden;
		}
		#lightbox.open { display: block; }

		#lightbox:fullscreen {
			background: #000;
		}
		/* For Webkit browsers */
		#lightbox:-webkit-full-screen {
			background: #000;
		}

		/* Stage: clips the track to one viewport width */
		#lb-stage { position: absolute; inset: 0; overflow: hidden; }

		/* Three-slot track: [prev | curr | next]
		   300% wide so each slot = 100vw.
		   Default translateX(-33.333%) centres the middle slot.
		   will-change applied by JS only during active drag/animation. */
		#lb-track {
			display: flex; width: 300%; height: 100%;
			transform: translateX(-33.333%);
		}
		.lb-slide {
			width: 33.333%; height: 100%; flex-shrink: 0;
			display: flex; align-items: center; justify-content: center;
		}
		.lb-slide img {
			max-width: 100%; max-height: 100%;
			width: 100%; height: 100%;
			object-fit: contain; display: block; border-radius: 2px;
			user-select: none; -webkit-user-drag: none;
		}
		/* Shadow + fade only on the visible centre slot */
		#lb-slide-curr img {
			box-shadow: 0 8px 60px rgba(0,0,0,.7);
			transition: opacity .15s ease;
		}
		#lb-slide-curr img.fading { opacity: 0; }

		/* ── Shared button style ─────────────────────────────────── */
		.lb-icon-btn {
			width: 38px; height: 38px; border-radius: 50%;
			border: 1px solid rgba(255,255,255,.14);
			background: rgba(255,255,255,.07);
			color: rgba(255,255,255,.65);
			cursor: pointer;
			display: flex; align-items: center; justify-content: center;
			transition: background .15s, color .15s, border-color .15s;
			backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
			text-decoration: none;
		}
		.lb-icon-btn:hover { background: rgba(255,255,255,.18); color: #fff; border-color: rgba(255,255,255,.3); }
		.lb-icon-btn.active { color: #6ee7b7; border-color: #6ee7b7; }

		/* ── Top-left: fullscreen ────────────────────────────────── */
		#lb-fullscreen {
			position: absolute; top: 16px; left: 16px; z-index: 2;
		}
		#lb-fullscreen.unsupported { display: none; }

		/* ── Top-right: share / download / close ─────────────────── */
		#lb-topbar {
			position: absolute; top: 16px; right: 16px;
			display: flex; gap: 8px; align-items: center; z-index: 2;
		}

		/* ── Nav arrows (desktop only) ───────────────────────────── */
		.lb-nav-btn {
			position: absolute; top: 50%; transform: translateY(-50%);
			width: 48px; height: 48px; border-radius: 50%;
			border: 1px solid rgba(255,255,255,.14);
			background: rgba(255,255,255,.07);
			color: rgba(255,255,255,.75);
			font-size: 1.3rem; cursor: pointer; line-height: 1;
			display: flex; align-items: center; justify-content: center;
			transition: background .15s, color .15s, border-color .15s;
			backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
			z-index: 2;
		}
		.lb-nav-btn:hover { background: rgba(255,255,255,.18); color: #fff; border-color: rgba(255,255,255,.3); }
		#lb-prev { left: 16px; }
		#lb-next { right: 16px; }
		@media (pointer: coarse) { #lb-prev, #lb-next { display: none; } }

		/* ── Caption bar ─────────────────────────────────────────── */
		#lb-caption {
			position: absolute; bottom: 0; left: 0; right: 0;
			padding: 14px 20px;
			display: flex; align-items: baseline; gap: 10px;
			background: linear-gradient(transparent, rgba(0,0,0,.55));
			opacity: 0; z-index: 2;
			pointer-events: none; transition: opacity .2s;
		}
		#lb-caption:hover { opacity: 1; }
		#lb-name    { font-size: .82rem; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		#lb-counter { font-size: .75rem; color: rgba(255,255,255,.35); white-space: nowrap; flex-shrink: 0; }
		#lb-copy {
			flex-shrink: 0; margin-left: auto; pointer-events: auto;
			background: none; border: 1px solid rgba(255,255,255,.18);
			border-radius: 5px; color: rgba(255,255,255,.45);
			padding: 4px 8px; cursor: pointer;
			display: flex; align-items: center; gap: 5px;
			font-size: .72rem; font-family: inherit;
			transition: background .15s, color .15s, border-color .15s;
		}
		#lb-copy:hover  { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.35); }
		#lb-copy.copied { color: #6ee7b7; border-color: #6ee7b7; }

		/* ── Loading spinner ─────────────────────────────────────── */
		#lb-spinner {
			position: absolute; top: 50%; left: 50%;
			transform: translate(-50%,-50%);
			width: 36px; height: 36px;
			border: 2px solid rgba(255,255,255,.12);
			border-top-color: rgba(255,255,255,.55);
			border-radius: 50%;
			animation: spin .7s linear infinite;
			opacity: 0; transition: opacity .2s;
			pointer-events: none; z-index: 3;
		}
		#lb-spinner.visible { opacity: 1; }
		@keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

		/* ── Hot-reload toast ────────────────────────────────────── */
		#reload-toast {
			position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
			background: rgba(40,40,40,.92); color: #e2e2e2;
			font-size: .78rem; padding: 8px 16px; border-radius: 20px;
			border: 1px solid rgba(255,255,255,.12);
			backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
			opacity: 0; transition: opacity .3s;
			pointer-events: none; z-index: 2000; white-space: nowrap;
		}
		#reload-toast.show { opacity: 1; }

		@media (max-width: 480px) {
			#gallery { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
		}
		</style>
	</head>
	<body>

		<header>
			<h1>__TITLE__</h1>
			<span class="count" id="js-count">__COUNT__</span>
		</header>

		<div id="gallery" role="list"></div>

		<div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
			<div id="lb-stage">
				<div id="lb-track">
					<div class="lb-slide" id="lb-slide-prev"><img id="lb-img-prev" src="" alt=""></div>
					<div class="lb-slide" id="lb-slide-curr"><img id="lb-img-curr" src="" alt=""></div>
					<div class="lb-slide" id="lb-slide-next"><img id="lb-img-next" src="" alt=""></div>
				</div>
			</div>
			<div id="lb-spinner" aria-hidden="true"></div>

			<!-- Top-left: fullscreen -->
			<button class="lb-icon-btn" id="lb-fullscreen" aria-label="Toggle fullscreen" title="Fullscreen">
				<svg id="lb-fs-enter" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
				<svg id="lb-fs-exit" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/></svg>
			</button>

			<!-- Top-right: share / download / close -->
			<div id="lb-topbar">
				<button class="lb-icon-btn" id="lb-share" aria-label="Share" title="Share">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
				</button>
				<a class="lb-icon-btn" id="lb-download" aria-label="Download" title="Download" download>
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
				</a>
				<button class="lb-icon-btn" id="lb-close" aria-label="Close">
					<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
				</button>
			</div>

			<!-- Nav arrows (hidden on touch devices via CSS) -->
			<button class="lb-nav-btn" id="lb-prev" aria-label="Previous image">&#8249;</button>
			<button class="lb-nav-btn" id="lb-next" aria-label="Next image">&#8250;</button>

			<!-- Caption + copy-link -->
			<div id="lb-caption" aria-live="polite">
				<span id="lb-name"></span>
				<span id="lb-counter"></span>
				<button id="lb-copy" title="Copy link" aria-label="Copy link to this image">
					<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
				</button>
			</div>
		</div>

		<div id="reload-toast" aria-live="polite"></div>

		<script src="/gallery.js"></script>
	</body>
</html>
